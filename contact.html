---
layout: default
title: Cory Freestyle
extra_css:
  - /assets/css/contact.css
head_extra: |
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
foot_extra: |
  <script>
      document.addEventListener('DOMContentLoaded', function () {
          const form = document.getElementById('contact-form');
          const thankYouMessage = document.getElementById('thank-you-message');

          form.addEventListener('submit', async function (event) {
              event.preventDefault(); // Prevent the default form submission

              // Verify reCAPTCHA before proceeding
              const recaptchaResponse = grecaptcha.getResponse();
              if (!recaptchaResponse) {
                  // Alert the user if reCAPTCHA is not verified
                  alert('Please complete the reCAPTCHA before submitting the form.');
                  return;
              }

              // Assuming you've already validated the form fields here

              // Display the thank you message
              thankYouMessage.style.display = 'block';

              // Hide the form
              form.style.display = 'none';

              // Send the form data to Formspree using fetch
              const formData = new FormData(form);
              try {
                  await fetch('https://formspree.io/f/mpzvavjn', {
                      method: 'POST',
                      headers: {
                          'Accept': 'application/json',
                      },
                      body: formData,
                  });
              } catch (error) {
                  console.error('Error submitting form:', error);
              }
          });
      });
  </script>
---
<div id="contact-form-container">
    <form id="contact-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <div class="g-recaptcha" data-sitekey="6LeESD4pAAAAANAn4oKqAvhsah0C_EPVVGGf5CZa"></div>

        <button type="submit">Submit</button>
    </form>

    <div id="thank-you-message">
        <p>Thank you for your message! We'll get back to you soon.</p>
    </div>
</div>
